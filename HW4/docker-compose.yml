services:
  postgres:
    image: postgres:16-alpine
    container_name: micro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: microdb
      POSTGRES_USER: micro
      POSTGRES_PASSWORD: micro123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - micro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micro -d microdb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api-node:
    build: ./backend-node
    container_name: micro-node
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://micro:micro123@postgres:5432/microdb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - micro-net
    expose:
      - "3000"

  api-rust:
    build: ./backend-rust
    container_name: micro-rust
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgres://micro:micro123@postgres:5432/microdb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - micro-net
    expose:
      - "8000"

  api-python:
    build: ./backend-python
    container_name: micro-python
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgres://micro:micro123@postgres:5432/microdb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - micro-net
    expose:
      - "5000"

  nginx:
    build: ./nginx
    container_name: micro-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api-node
      - api-rust
      - api-python
    networks:
      - micro-net

networks:
  micro-net:
    driver: bridge

volumes:
  pgdata:
