# 上游微服務
upstream node_backend {
    server api-node:3000;
}
upstream rust_backend {
    server api-rust:8000;
}
upstream python_backend {
    server api-python:5000;
}

server {
    listen 80;
    server_name localhost;

    # 前端靜態頁
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 健康檢查（nginx 本體）
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx","role":"web-server+reverse-proxy"}';
    }

    # 反向代理：strip 前綴後轉發
    # 前端呼叫 /api/node/health -> node 的 /health
    location /api/node/ {
        proxy_pass http://node_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/rust/ {
        proxy_pass http://rust_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/python/ {
        proxy_pass http://python_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 统一错误回傳 JSON
    error_page 502 503 504 /50x.json;
    location = /50x.json {
        root /usr/share/nginx/html;
    }
}
