{% extends "base.html" %}
{% block body %}
<h1>教師管理</h1>
<form method="get" class="inline">
  <input name="q" placeholder="搜尋編號/姓名/科別" value="{{ q }}">
  <button>搜尋</button>
  {% if q %}<a href="{{ url_for('teachers') }}">清除</a>{% endif %}
</form>
<form method="post" class="panel">
  <h3>新增教師</h3>
  <input name="id" placeholder="編號 *" required>
  <input name="name" placeholder="姓名 *" required>
  <input name="subject" placeholder="科別/專長">
  <input name="phone" placeholder="電話">
  <button>新增</button>
</form>
<table>
<tr><th>編號</th><th>姓名</th><th>科別</th><th>電話</th><th></th></tr>
{% for r in rows %}
<tr><td>{{ r.id }}</td><td>{{ r.name }}</td><td>{{ r.subject }}</td><td>{{ r.phone }}</td>
<td><a class="del" href="{{ url_for('teachers_delete', tid=r.id) }}" onclick="return confirm('確定刪除?')">刪除</a></td></tr>
{% else %}
<tr><td colspan="5">尚無資料</td></tr>
{% endfor %}
</table>
{% endblock %}
